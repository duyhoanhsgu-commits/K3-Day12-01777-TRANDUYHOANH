name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run pytest
        env:
          AGENT_API_KEY: test1234
          REDIS_URL: "fake://"
        run: |
          pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Production
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "Deploy hook not configured, skipping trigger"
          fi

      - name: Smoke test
        run: |
          echo "Checking service health..."
          curl -fsS "https://day12-agent-2xtt.onrender.com/health" || true
